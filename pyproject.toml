[project]
name = "thumbnail-maker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "arq>=0.28.0",
    "brevo-python>=5.0.2",
    "fastapi[stadard,standard]>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "redis>=5.3.1",
    "sqlalchemy>=2.0.52",
    "upstash-redis>=1.8.0",
]


[tool.fastapi]
entrypoint = "app.main:app"
